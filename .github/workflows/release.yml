name: Build Executables

on:
  push:
    branches:
      - main        # Сборка запускается при каждом пуше в ветку main
      - github_actions 
    tags:
      - 'v*'        # Сборка + публикации в Релизы запускаются только при создании тега
  workflow_dispatch: # Ручной запуск через UI GitHub

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: PhageGrowthAnalyzer-Windows
            build_cmd: pyinstaller --noconfirm --onedir --windowed --name PhageGrowthAnalyzer main.py

          - os: ubuntu-latest
            artifact_name: PhageGrowthAnalyzer-Linux
            build_cmd: pyinstaller --noconfirm --onedir --windowed --name PhageGrowthAnalyzer main.py

          - os: macos-latest
            artifact_name: PhageGrowthAnalyzer-macOS
            build_cmd: pyinstaller --noconfirm --onedir --windowed --name PhageGrowthAnalyzer main.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Системные зависимости для GUI на Linux
      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libfontconfig1 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-randr0 \
            libxcb-xfixes0 \
            libxkbcommon-x11-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: ${{ matrix.build_cmd }}

      # Загружаем готовую папку сборки напрямую (GitHub сам упакует её в аккуратный .zip)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/PhageGrowthAnalyzer
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Упаковываем артефакты в архив перед загрузкой в GitHub Release
      - name: Prepare Release Archives
        run: |
          cd artifacts
          zip -r ../PhageGrowthAnalyzer-Windows.zip PhageGrowthAnalyzer-Windows
          tar -czvf ../PhageGrowthAnalyzer-Linux.tar.gz PhageGrowthAnalyzer-Linux
          tar -czvf ../PhageGrowthAnalyzer-macOS.tar.gz PhageGrowthAnalyzer-macOS
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PhageGrowthAnalyzer-Windows.zip
            PhageGrowthAnalyzer-Linux.tar.gz
            PhageGrowthAnalyzer-macOS.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
